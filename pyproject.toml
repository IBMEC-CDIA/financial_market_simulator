[project]
name = "financial-market-simulator"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "wandb",
    "python-dotenv",
    "yfinance>=1.7.0",
    "tqdm",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pylint",
    "httpx>=0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121", marker = "sys_platform == 'win32'" }

[tool.pylint.format]
max-line-length = 79
