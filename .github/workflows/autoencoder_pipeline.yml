name: Autoencoder Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - "specs/**"
      - "docs/**"
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "specs/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker symbol to train on"
        required: true
        default: "AAPL"
        type: string

permissions:
  contents: read

concurrency:
  group: autoencoder-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit tests and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv

      - name: Run pylint
        run: uv run pylint src/generative_models tests

      - name: Run unit tests with coverage
        run: >
          uv run pytest
          --ignore=tests/end_to_end
          --cov=generative_models
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90
          --junitxml=junit-unit.xml

      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project \
            --output-file requirements-lock.txt
          grep -v "sys_platform == 'win32'" requirements-lock.txt \
            | sed -E 's/\+cu[0-9]+//' > requirements-audit.txt
          uvx pip-audit --disable-pip --no-deps --requirement requirements-audit.txt

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            junit-unit.xml
            coverage.xml
          if-no-files-found: ignore

  end-to-end-tests:
    name: End-to-end tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv

      - name: Run end-to-end tests
        run: uv run pytest tests/end_to_end

  collect-data:
    name: Collect market data
    needs:
      - unit-tests
      - end-to-end-tests
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TRAIN_TICKER: ${{ inputs.ticker || 'AAPL' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv

      - name: Collect the market prices
        run: >
          uv run python -m generative_models.data.collect_market_data
          --ticker "$TRAIN_TICKER"
          --output-path "market-data/$TRAIN_TICKER.csv"

      - name: Upload market prices
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ env.TRAIN_TICKER }}
          path: market-data/*.csv
          if-no-files-found: error

  train:
    name: Train autoencoder
    needs: collect-data
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      TRAIN_TICKER: ${{ inputs.ticker || 'AAPL' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv

      - name: Download market prices
        uses: actions/download-artifact@v4
        with:
          name: market-data-${{ env.TRAIN_TICKER }}
          path: market-data

      - name: Train the autoencoder model
        run: >
          uv run python -m generative_models.models.autoencoder.train_autoencoder
          --ticker "$TRAIN_TICKER"
          --price-data-path "market-data/$TRAIN_TICKER.csv"
          --device cpu
          --output-directory artifacts

      - name: Upload model weights and report
        uses: actions/upload-artifact@v4
        with:
          name: autoencoder-model-${{ env.TRAIN_TICKER }}
          path: |
            artifacts/*.pt
            artifacts/*-overfitting.json
          if-no-files-found: error

  evaluate:
    name: Evaluate overfitting
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TRAIN_TICKER: ${{ inputs.ticker || 'AAPL' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv

      - name: Download model weights and report
        uses: actions/download-artifact@v4
        with:
          name: autoencoder-model-${{ env.TRAIN_TICKER }}
          path: artifacts

      - name: Check overfitting
        run: >
          uv run python -m generative_models.models.autoencoder.overfitting
          --report-path artifacts/*-overfitting.json

  build-image:
    name: Build Docker image
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/financial-market-simulator:${{ github.sha }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/financial-market-simulator:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Save image to a file
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/financial-market-simulator
        run: docker save -o financial-market-simulator.tar "$IMAGE_NAME:$GITHUB_SHA"

      - name: Upload image file
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: financial-market-simulator.tar
          if-no-files-found: error

  push-image:
    name: Push Docker image
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download image file
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i financial-market-simulator.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image to Docker Hub
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/financial-market-simulator
        run: |
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
