name: Autoencoder Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker symbol to train on"
        required: true
        default: "AAPL"
        type: string

permissions:
  contents: read

concurrency:
  group: autoencoder-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12.10"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pylint
        run: uv run pylint src/generative_models tests

      - name: Run tests
        run: uv run pytest

  train:
    needs: test
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      TRAIN_TICKER: ${{ inputs.ticker || 'AAPL' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12.10"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Train the autoencoder model
        run: >
          uv run python -m generative_models.models.autoencoder.train_autoencoder
          --ticker "$TRAIN_TICKER"
          --device cpu
          --output-directory artifacts

      - name: Upload model weights
        uses: actions/upload-artifact@v4
        with:
          name: autoencoder-model-${{ env.TRAIN_TICKER }}
          path: artifacts/*.pt
          if-no-files-found: error

  docker:
    needs: test
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/financial-market-simulator

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
