name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker symbol to train on, for example AAPL"
        required: true
        default: "AAPL"
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12.10"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pylint
        run: uv run pylint src/generative_models tests

      - name: Run tests
        run: uv run pytest

  train:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      TRAIN_TICKER: ${{ inputs.ticker || 'AAPL' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12.10"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Train the autoencoder model
        run: >
          uv run python -m generative_models.models.autoencoder.train_autoencoder
          --ticker "$TRAIN_TICKER"
          --device cpu
          --output-directory artifacts

      - name: Upload model weights
        uses: actions/upload-artifact@v4
        with:
          name: autoencoder-model-${{ env.TRAIN_TICKER }}
          path: artifacts/*.pt
          if-no-files-found: error
