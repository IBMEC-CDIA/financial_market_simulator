name: Train

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker symbol to train on"
        required: true
        default: "AAPL"
        type: string
      epochs:
        description: "Number of training epochs"
        default: 300
        type: number
      learning_rate:
        description: "Learning rate of the Adam optimizer"
        default: 0.001
        type: number
      window_size:
        description: "Number of log-returns in each window"
        default: 10
        type: number

permissions:
  contents: read

concurrency:
  group: train-${{ inputs.ticker }}
  cancel-in-progress: false

jobs:
  ci-check:
    name: Check that CI passed for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Require a successful CI run for this commit
        run: |
          successful_runs=$(gh run list \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq 'length')
          if [ "$successful_runs" -lt 1 ]; then
            echo "No successful CI run was found for commit $GITHUB_SHA."
            exit 1
          fi
          echo "CI passed for commit $GITHUB_SHA."

  test-end-to-end:
    name: End-to-end tests
    needs: ci-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv

      - name: Run end-to-end tests
        run: uv run pytest tests/end_to_end

  collect-data:
    name: Collect market data
    needs: test-end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TICKER: ${{ inputs.ticker }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv

      - name: Collect the market prices
        run: >
          uv run python -m generative_models.data.collect_market_data
          --ticker "$TICKER"
          --output-path "market-data/$TICKER.csv"

      - name: Upload market prices
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ env.TICKER }}
          path: market-data/*.csv
          if-no-files-found: error

  train-autoencoder:
    name: Train autoencoder
    needs: collect-data
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      TICKER: ${{ inputs.ticker }}
      EPOCHS: ${{ inputs.epochs }}
      LEARNING_RATE: ${{ inputs.learning_rate }}
      WINDOW_SIZE: ${{ inputs.window_size }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv

      - name: Download market prices
        uses: actions/download-artifact@v4
        with:
          name: market-data-${{ env.TICKER }}
          path: market-data

      - name: Train the autoencoder model
        run: >
          uv run python -m generative_models.models.base_autoencoder.run_train_script
          --ticker "$TICKER"
          --price-data-path "market-data/$TICKER.csv"
          --epochs "$EPOCHS"
          --learning-rate "$LEARNING_RATE"
          --window-size "$WINDOW_SIZE"
          --device cpu
          --output-directory artifacts

      - name: Upload model weights and report
        uses: actions/upload-artifact@v4
        with:
          name: autoencoder-model-${{ env.TICKER }}
          path: |
            artifacts/*.pt
            artifacts/*-overfitting.json
          if-no-files-found: error

  evaluate:
    name: Evaluate overfitting
    needs: train-autoencoder
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TICKER: ${{ inputs.ticker }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv

      - name: Download model weights and report
        uses: actions/download-artifact@v4
        with:
          name: autoencoder-model-${{ env.TICKER }}
          path: artifacts

      - name: Check overfitting and baseline
        run: >
          uv run python -m generative_models.models.base_autoencoder.overfitting
          --report-path artifacts/*-overfitting.json

  pipeline-success:
    name: Train Run Successfully
    if: always()
    needs:
      - ci-check
      - test-end-to-end
      - collect-data
      - train-autoencoder
      - evaluate
    runs-on: ubuntu-latest

    env:
      NEEDS_JSON: ${{ toJSON(needs) }}

    steps:
      - name: Check that every job succeeded
        run: |
          FAILED_JOBS=$(printf '%s' "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success")
            | "\(.key): \(.value.result)"')
          if [ -n "$FAILED_JOBS" ]; then
            echo "Jobs that did not succeed:"
            echo "$FAILED_JOBS"
            exit 1
          fi
          echo "All jobs succeeded."
