name: 04 - Deploy API

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Docker Hub image to deploy, in the form <user>/financial-market-simulator:<model>-<tickers>, for example myuser/financial-market-simulator:gru-autoencoder-aapl-msft (or <tickers> alone, for example aapl-msft). The Build workflow pushes it. The container name and the DNS label are derived from the tag."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.image }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Check the image and derive the container name
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      container_name: ${{ steps.derive.outputs.container_name }}

    env:
      IMAGE: ${{ inputs.image }}

    steps:
      - name: Require an image of this project
        run: |
          pattern='^[a-z0-9]+([._-][a-z0-9]+)*/financial-market-simulator:[a-z0-9][a-z0-9._-]{0,127}$'
          if ! printf '%s' "$IMAGE" | grep -Eq "$pattern"; then
            echo "The image must be <user>/financial-market-simulator:<tickers>, in lower case, got: $IMAGE"
            exit 1
          fi
          echo "Image to deploy: $IMAGE"

      - name: Derive the container name and the DNS label from the tickers
        id: derive
        run: |
          image_tag="${IMAGE##*:}"
          container_name="fmsim-$(printf '%s' "$image_tag" | tr '.' '-')"
          if [ "${#container_name}" -gt 63 ]; then
            echo "The container name would be longer than 63 characters: $container_name"
            exit 1
          fi
          if ! printf '%s' "$container_name" | grep -Eq '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'; then
            echo "The container name is not a valid DNS label: $container_name"
            exit 1
          fi
          echo "Container name and DNS label: $container_name"
          echo "container_name=$container_name" >> "$GITHUB_OUTPUT"

  deploy:
    name: Replace the Azure container instance
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'production' }}
    permissions:
      contents: read

    env:
      IMAGE: ${{ inputs.image }}
      CONTAINER_NAME: ${{ needs.validate-inputs.outputs.container_name }}
      DNS_NAME_LABEL: ${{ needs.validate-inputs.outputs.container_name }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      LOCATION: ${{ vars.AZURE_LOCATION || 'brazilsouth' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Check the deploy configuration
        run: |
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "The repository variable AZURE_RESOURCE_GROUP is required."
            exit 1
          fi
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "The secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are required to pull the image."
            exit 1
          fi
          echo "Deploying $IMAGE as $CONTAINER_NAME in $RESOURCE_GROUP ($LOCATION)."

      - name: Hide the Docker Hub token from the logs
        run: |
          echo "::add-mask::$DOCKERHUB_TOKEN"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Replace the existing container instance
        run: |
          if az container show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_NAME" > /dev/null 2>&1; then
            echo "Deleting the existing container instance $CONTAINER_NAME."
            az container delete \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_NAME" \
              --yes
          fi

          az container create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_NAME" \
            --location "$LOCATION" \
            --image "$IMAGE" \
            --os-type Linux \
            --cpu 1 \
            --memory 2 \
            --ports 8000 \
            --ip-address Public \
            --dns-name-label "$DNS_NAME_LABEL" \
            --registry-login-server docker.io \
            --registry-username "$DOCKERHUB_USERNAME" \
            --registry-password "$DOCKERHUB_TOKEN"

      - name: Wait until the container instance is running
        run: |
          for attempt in $(seq 1 120); do
            state=$(az container show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_NAME" \
              --query "{provisioning: provisioningState, state: instanceView.state}" \
              --output json)
            provisioning=$(printf '%s' "$state" | jq -r '.provisioning')
            running=$(printf '%s' "$state" | jq -r '.state')
            echo "Attempt $attempt of 120: provisioning=$provisioning state=$running"
            if [ "$provisioning" = "Failed" ]; then
              echo "The container instance failed to provision."
              exit 1
            fi
            if [ "$provisioning" = "Succeeded" ] && [ "$running" = "Running" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "The container instance was not running after 20 minutes."
          exit 1

      - name: Wait until the API answers and has a model loaded
        run: |
          fqdn=$(az container show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_NAME" \
            --query ipAddress.fqdn \
            --output tsv)
          echo "Checking http://$fqdn:8000/health"
          for attempt in $(seq 1 240); do
            if curl -fsS --max-time 5 "http://$fqdn:8000/health" > /dev/null 2>&1; then
              loaded=$(curl -fsS --max-time 30 "http://$fqdn:8000/models/loaded" || echo "[]")
              if [ "$(printf '%s' "$loaded" | jq 'length')" -ge 1 ]; then
                echo "$loaded"
                echo "Deployed $IMAGE at http://$fqdn:8000"
                exit 0
              fi
            fi
            echo "Attempt $attempt of 240: the API is not ready yet."
            sleep 5
          done
          echo "The API did not answer with a loaded model after 20 minutes."
          exit 1

  pipeline-success:
    name: Deploy Run Successfully
    if: always()
    needs:
      - validate-inputs
      - deploy
    runs-on: ubuntu-latest

    env:
      NEEDS_JSON: ${{ toJSON(needs) }}

    steps:
      - name: Check that every job succeeded
        run: |
          FAILED_JOBS=$(printf '%s' "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success")
            | "\(.key): \(.value.result)"')
          if [ -n "$FAILED_JOBS" ]; then
            echo "Jobs that did not succeed:"
            echo "$FAILED_JOBS"
            exit 1
          fi
          echo "All jobs succeeded."
