name: Build

on:
  workflow_dispatch:
    inputs:
      train_run_id:
        description: "Run id of a successful Train workflow whose trained models are copied into the image. Leave empty to use the latest successful Train run of this branch."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-check:
    name: Check that CI passed for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Require a successful CI run
        run: |
          successful_runs=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq 'length')
          if [ "$successful_runs" -lt 1 ]; then
            echo "No successful CI run was found for commit $GITHUB_SHA."
            exit 1
          fi
          echo "CI passed for commit $GITHUB_SHA."

  build-image:
    name: Build Docker image and scan for vulnerabilities
    needs: ci-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read

    env:
      IMAGE_NAME: financial-market-simulator:${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      TRAIN_RUN_ID: ${{ inputs.train_run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the trained models into the build context
        run: |
          run_id="$TRAIN_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list               --repo "$GITHUB_REPOSITORY"               --workflow train.yml               --branch "$GITHUB_REF_NAME"               --status success               --limit 1               --json databaseId               --jq '.[0].databaseId')
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful Train run was found for the models."
            exit 1
          fi
          echo "Using the trained models of run $run_id."
          mkdir -p models
          gh run download "$run_id"             --repo "$GITHUB_REPOSITORY"             --name trained-models             --dir models
          ls -l models

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Smoke test the API container with the trained models
        run: |
          container_id=$(docker run -d -p 8000:8000 "$IMAGE_NAME")
          trap 'docker logs "$container_id"; docker rm -f "$container_id" > /dev/null' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/health > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          loaded=$(curl -fsS --max-time 30 http://127.0.0.1:8000/models/loaded)
          echo "$loaded"
          test "$(printf '%s' "$loaded" | jq 'length')" -ge 1
          ticker=$(printf '%s' "$loaded" | jq -r '.[0].ticker')
          window=$(printf '%s' "$loaded" | jq -r '.[0].window_size')
          body=$(jq -n --arg ticker "$ticker" --argjson window "$window" \
            '{ticker: $ticker, log_returns: [range($window) | 0.0]}')
          curl -fsS --max-time 30 -H 'Content-Type: application/json' \
            -d "$body" http://127.0.0.1:8000/predictions/log-returns > /dev/null
          echo "Prediction for $ticker succeeded."

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-report.json
          exit-code: "0"

      - name: Fail on fixable CRITICAL or HIGH vulnerabilities
        run: |
          FIXABLE_LIST=$(jq -r '.Results[]? as $result | $result.Vulnerabilities[]? | select(.FixedVersion != null and .FixedVersion != "") | "\($result.Target) \(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)"' trivy-report.json)
          FIXABLE_COUNT=$(printf '%s\n' "$FIXABLE_LIST" | grep -c . || true)
          {
            echo "## Image vulnerabilities"
            echo ""
            echo "Fixable CRITICAL or HIGH vulnerabilities: $FIXABLE_COUNT"
            echo ""
            printf '%s\n' "$FIXABLE_LIST" | sed '/^$/d; s/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$FIXABLE_LIST" | sed '/^$/d'
          test "$FIXABLE_COUNT" -eq 0

  pipeline-success:
    name: Build Run Successfully
    if: always()
    needs:
      - ci-check
      - build-image
    runs-on: ubuntu-latest

    env:
      NEEDS_JSON: ${{ toJSON(needs) }}

    steps:
      - name: Check that every job succeeded
        run: |
          FAILED_JOBS=$(printf '%s' "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success")
            | "\(.key): \(.value.result)"')
          if [ -n "$FAILED_JOBS" ]; then
            echo "Jobs that did not succeed:"
            echo "$FAILED_JOBS"
            exit 1
          fi
          echo "All jobs succeeded."
